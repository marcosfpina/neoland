[package]
name = "neoland-web"
version = "0.1.0"
edition = "2024"

[lib]
name = "neoland_web"
path = "src/lib.rs"

[[bin]]
name = "neoland-web"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["EventSource", "HtmlInputElement", "KeyboardEvent", "MessageEvent"] }

# gRPC-web message types (protobuf, WASM-compatible)
# Full gRPC-web client bridge requires tonic (tokio threads) → deferred to v0.4.0.
# For now: server-side gRPC-web support is live; browser uses REST + SSE.
prost = "0.13"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
prost-build = "0.13"
