[package]
name = "neoland-web"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement", "KeyboardEvent"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
