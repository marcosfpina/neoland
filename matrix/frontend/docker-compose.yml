version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: devhub-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - devhub-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: devhub-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env.local
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - devhub-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: devhub-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=devhub
      - POSTGRES_USER=devhub
      - POSTGRES_PASSWORD=devhub123
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    networks:
      - devhub-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: devhub-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - devhub-network

networks:
  devhub-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
