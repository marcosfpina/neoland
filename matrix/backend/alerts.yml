# Prometheus Alerting Rules - AI Assistant Backend
# =================================================
# Alert rules for monitoring AI Agent decisions.
#
# Alerts:
# - High rejection rate
# - Low STF compliance
# - High latency
# - Backend unavailable

groups:
  - name: ai_agent_alerts
    interval: 10s
    rules:
      # Alert: High rejection rate (> 30%)
      - alert: HighRejectionRate
        expr: |
          (
            sum(rate(ai_agent_decisions_total{approved="False"}[5m]))
            /
            sum(rate(ai_agent_decisions_total[5m]))
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          component: ai-agent-backend
        annotations:
          summary: "High decision rejection rate detected"
          description: "More than 30% of decisions are being rejected (current: {{ $value | humanizePercentage }})"

      # Alert: Low STF compliance (< 90%)
      - alert: LowSTFCompliance
        expr: ai_agent_stf_compliance_rate < 0.9
        for: 5m
        labels:
          severity: critical
          component: ai-agent-backend
        annotations:
          summary: "STF compliance rate below threshold"
          description: "STF compliance rate is {{ $value | humanizePercentage }} (threshold: 90%)"

      # Alert: High P95 latency (> 500ms)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            rate(ai_agent_decision_latency_seconds_bucket[5m])
          ) > 0.5
        for: 3m
        labels:
          severity: warning
          component: ai-agent-backend
        annotations:
          summary: "High decision latency detected"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"

      # Alert: Backend unavailable
      - alert: BackendDown
        expr: up{job="ai-agent-backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: ai-agent-backend
        annotations:
          summary: "AI Agent Backend is down"
          description: "The AI Agent Backend has been unreachable for 1 minute"

      # Alert: High human review queue (> 10 pending)
      - alert: HighHumanReviewQueue
        expr: |
          sum(rate(ai_agent_human_reviews_total[5m])) * 300 > 10
        for: 10m
        labels:
          severity: warning
          component: ai-agent-backend
        annotations:
          summary: "High number of decisions requiring human review"
          description: "Estimated {{ $value }} decisions waiting for human review"

      # Alert: STF violations spike
      - alert: STFViolationsSpike
        expr: |
          rate(ai_agent_stf_violations_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: ai-agent-backend
        annotations:
          summary: "Spike in STF violations detected"
          description: "STF violations rate is {{ $value }} per second"

      # Alert: No decisions processed (backend stuck?)
      - alert: NoDecisionsProcessed
        expr: |
          rate(ai_agent_decisions_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
          component: ai-agent-backend
        annotations:
          summary: "No decisions being processed"
          description: "No decisions have been processed in the last 10 minutes"

      # Alert: Low agent diversity (only 1 agent active)
      - alert: LowAgentDiversity
        expr: |
          count(count by (agent_id) (ai_agent_decisions_total)) < 2
        for: 30m
        labels:
          severity: info
          component: ai-agent-backend
        annotations:
          summary: "Low agent diversity detected"
          description: "Only {{ $value }} unique agent(s) have made decisions in the last 30 minutes"
