[workspace]
members = [".", "web"]
resolver = "2"

[package]
name = "neoland"
version = "0.0.1"
edition = "2021"
authors = ["voidnxlabs <sec@voidnxlabs.com>"]

[[bin]]
name = "neoland"
path = "src/bin/neoland.rs"

[dependencies]
# CLI & Logging
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# TUI (novo para neoland-tui)
ratatui = "0.28"
crossterm = "0.28"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
futures = "0.3"

reqwest = { version = "0.12", features = ["json", "blocking", "stream", "multipart", "cookies"] }
async-channel = "2.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
lru = "0.12"

# TLS / mTLS (v0.0.1)
rustls = "0.23"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tokio-rustls = "0.26"

# Secrets Management (Phase 1.2)
vaultrs = "0.7"

# Audit Logging (Phase 1.3)
async-trait = "0.1"

# Observability & Metrics (Phase 4.1)
prometheus = "0.13"
lazy_static = "1.4"
opentelemetry = { version = "0.27", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = "0.28"

# Persistent Storage (Phase 4.7)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
pgvector = { version = "=0.4.1", features = ["sqlx"] }  # 0.4.2 requer sqlx 0.9; ficamos no sqlx 0.8

# IPC (Ciclo 1 — Fase A)
memmap2 = "0.9"

# NATS event bus (Ciclo 1 — Fase B)
spectre-events = { git = "https://github.com/VoidNxSEC/spectre.git", rev = "7f9548dd5652394b93b4404bf62cfb2624ab3e68" }
spectre-core = { git = "https://github.com/VoidNxSEC/spectre.git", rev = "7f9548dd5652394b93b4404bf62cfb2624ab3e68" }
async-nats = "0.46"
thiserror = "1.0"

# OAuth2 & JWT (v0.0.1 enterprise auth)
oauth2 = { version = "5", features = ["reqwest"] }
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"

# SSO / LDAP enterprise auth (v0.0.1 #3)
ldap3 = "0.11"
base64 = "0.22"

# gRPC & Async
tonic = { version = "0.12", features = ["tls"] }
tonic-web = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Local Inference Engine (Candle)
candle-core = "0.8"
candle-transformers = "0.8"
candle-nn = "0.8"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hf-hub = "0.4"

# Integration Dependencies
# Git dependencies with pinned revisions for reproducible builds.
# For local development, override with path in .cargo/config.toml.
securellm-core = { git = "https://github.com/VoidNxSEC/securellm-bridge.git", rev = "1135bdc13f0ec9127576ef6518949f91b26c0ff6" }
securellm-providers = { git = "https://github.com/VoidNxSEC/securellm-bridge.git", rev = "1135bdc13f0ec9127576ef6518949f91b26c0ff6" }
securellm-security = { git = "https://github.com/VoidNxSEC/securellm-bridge.git", rev = "1135bdc13f0ec9127576ef6518949f91b26c0ff6" }
intelagent-core = { git = "https://github.com/marcosfpina/IntelAgent.git", rev = "4b340000a5f09e491264aead6d7a4a41166e421f" }


[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# Security Testing (Phase 2.4)
regex = "1.11"

# Test Infrastructure
tempfile = "3.14"

# Performance Testing
criterion = "0.5"

[[test]]
name = "fuzz_endpoints"
path = "tests/security/fuzz_endpoints.rs"
harness = true

[[test]]
name = "pentest_scenarios"
path = "tests/security/pentest_scenarios.rs"
harness = true

[[bench]]
name = "inference_benchmark"
path = "benches/inference_benchmark.rs"
harness = false

# Workspace-wide release profile — applies to all members (neoland + neoland-web)
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
