[package]
name = "neoland"
version = "0.1.0"
edition = "2021"
authors = ["voidnxlabs <sec@voidnxlabs.com>"]

[[bin]]
name = "neoland"
path = "src/bin/neoland.rs"

[dependencies]
# CLI & Logging
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# TUI (novo para neoland-tui)
ratatui = "0.28"
crossterm = "0.28"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
futures = "0.3"

reqwest = { version = "0.12", features = ["json", "blocking", "stream", "multipart", "cookies"] }
async-channel = "2.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
lru = "0.12"

# Secrets Management (Phase 1.2)
vaultrs = "0.7"

# Audit Logging (Phase 1.3)
async-trait = "0.1"

# Observability & Metrics (Phase 4.1)
prometheus = "0.13"
lazy_static = "1.4"
opentelemetry = { version = "0.27", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = "0.28"

# Persistent Storage (Phase 4.7)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }

# IPC (Ciclo 1 — Fase A)
memmap2 = "0.9"

# NATS event bus (Ciclo 1 — Fase B)
spectre-events = { path = "../spectre/crates/spectre-events" }
spectre-core = { path = "../spectre/crates/spectre-core" }
async-nats = "0.46"
thiserror = "1.0"

# gRPC & Async
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Local Inference Engine (Candle)
candle-core = "0.8"
candle-transformers = "0.8"
candle-nn = "0.8"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hf-hub = "0.3"

# Integration Dependencies
# Git dependencies with pinned revisions for reproducible builds.
# For local development, override with path in .cargo/config.toml:
#   [patch.'ssh://git@github.com/marcosfpina/securellm-bridge.git']
securellm-core = { path = "../securellm-bridge/crates/core" }
securellm-providers = { path = "../securellm-bridge/crates/providers" }
securellm-security = { path = "../securellm-bridge/crates/security" }
intelagent-core = { path = "../intelagent/crates/core" }
hyprland-ipc = { path = "../ai-agent-os/crates/hyprland-ipc" }


[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# Security Testing (Phase 2.4)
regex = "1.11"

# Test Infrastructure
tempfile = "3.14"

# Performance Testing
criterion = "0.5"

[[test]]
name = "fuzz_endpoints"
path = "tests/security/fuzz_endpoints.rs"
harness = true

[[test]]
name = "pentest_scenarios"
path = "tests/security/pentest_scenarios.rs"
harness = true

[[bench]]
name = "inference_benchmark"
path = "benches/inference_benchmark.rs"
harness = false
