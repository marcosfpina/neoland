[package]
name = "llamachat-poc"
version = "0.1.0"
edition = "2021"
maintainer = "kernelcore"

[[bin]]
name = "neoland"
path = "src/bin/neoland.rs"

[dependencies]
# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# TUI (novo para neoland-tui)
ratatui = "0.28"
crossterm = "0.28"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"

reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
async-channel = "2.3"
uuid = { version = "1.0", features = ["v4"] }

# Secrets Management (Phase 1.2)
vaultrs = "0.7"

# Audit Logging (Phase 1.3)
async-trait = "0.1"

# Observability & Metrics (Phase 4.1)
prometheus = "0.13"
lazy_static = "1.4"

# gRPC & Async
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Local Inference Engine (Candle)
candle-core = "0.8"
candle-transformers = "0.8"
candle-nn = "0.8"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hf-hub = "0.3"

# Integration Dependencies (Path-based - TEMPORARY)
# NOTE: Path dependencies are used for active development but break build reproducibility.
# Production deployment requires converting these to git dependencies or a private registry.
# See DEPENDENCIES.md for migration roadmap and setup instructions.
# TODO (Phase 0): Convert to git dependencies once phantom-ray is migrated to git
securellm-core = { path = "../securellm-bridge/crates/core" }
securellm-providers = { path = "../securellm-bridge/crates/providers" }
securellm-security = { path = "../securellm-bridge/crates/security" }
intelagent-core = { path = "../phantom-ray/phantom/intelagent/crates/core" }
hyprland-ipc = { path = "../ai-agent-os/crates/hyprland-ipc" }


[build-dependencies]
tonic-build = "0.12"
