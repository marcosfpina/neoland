name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Gate: run all tests before building ──────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (WASM)
        run: cargo clippy -p neoland-web --target wasm32-unknown-unknown -- -D warnings

      - name: Unit tests (core)
        run: cargo test --lib --verbose

      - name: Unit tests (web)
        run: cargo test -p neoland-web --verbose

  # ── Build artifacts ──────────────────────────────────────────────────
  build-server:
    name: Build Server Binary
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Build release binary
        run: cargo build --release --bin neoland

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoland-server
          path: target/release/neoland
          retention-days: 1

  build-web:
    name: Build Web Console
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build WASM
        run: cd web && trunk build --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoland-web-dist
          path: web/dist/
          retention-days: 1

  # ── Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-server, build-web]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: neoland-server
          path: artifacts/

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: neoland-web-dist
          path: artifacts/web/dist/

      - name: Package release archive
        run: |
          chmod +x artifacts/neoland
          cd artifacts
          tar czf ../neoland.tar.gz neoland web/

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check for Release Notes
        id: notes
        run: |
          NOTES_FILE="RELEASE-${{ steps.tag.outputs.tag }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT
            echo "Release notes found: $NOTES_FILE"
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
            echo "No RELEASE-*.md found — auto-generating notes."
          fi

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ "$TAG" == *"-rc"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-dev"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          generate_release_notes: ${{ steps.notes.outputs.notes_file == '' }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: neoland.tar.gz
