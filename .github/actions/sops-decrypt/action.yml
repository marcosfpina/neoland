name: Decrypt SOPS env secrets
description: >
  Decrypt a SOPS-encrypted .env file and export its key=value pairs as masked
  GitHub Actions environment variables. Requires nix to be installed in the job.

inputs:
  age-key:
    required: true
    description: Age private key content (SOPS_AGE_KEY secret)
  sops-file:
    required: false
    default: secrets/neoland.sops.env
    description: Path to the SOPS-encrypted .env file

runs:
  using: composite
  steps:
    - name: Write age key
      shell: bash
      env:
        AGE_KEY: ${{ inputs.age-key }}
      run: |
        mkdir -p ~/.config/sops/age
        printf '%s' "$AGE_KEY" > ~/.config/sops/age/keys.txt
        chmod 600 ~/.config/sops/age/keys.txt

    - name: Decrypt and export secrets
      shell: bash
      run: |
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        nix run nixpkgs#sops -- --decrypt "${{ inputs.sops-file }}" > "$tmp"
        while IFS= read -r line || [[ -n "$line" ]]; do
          [[ -z "$line" || "$line" == \#* ]] && continue
          value="${line#*=}"
          echo "::add-mask::$value"
          printf '%s\n' "$line" >> "$GITHUB_ENV"
        done < "$tmp"

    - name: Revoke age key
      if: always()
      shell: bash
      run: rm -f ~/.config/sops/age/keys.txt
