name: Nix Evaluation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VOIDNXSEC_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Extract Cachix token from SOPS
        id: sops-cachix
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [[ -z "$SOPS_AGE_KEY" ]]; then
            echo "token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.config/sops/age
          printf '%s' "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
          token=$(nix run nixpkgs#sops -- --decrypt --extract '["CACHIX_AGENT_TOKEN"]' secrets/cachix.sops.yaml)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          rm -f ~/.config/sops/age/keys.txt

      - uses: cachix/cachix-action@v16
        if: steps.sops-cachix.outputs.token != ''
        with:
          name: neoland
          authToken: ${{ steps.sops-cachix.outputs.token }}

      - name: Flake check
        run: nix flake check --show-trace

  build-web:
    name: Nix build neoland-web
    runs-on: ubuntu-latest
    needs: [flake-check]
    steps:
      - uses: actions/checkout@v7

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VOIDNXSEC_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      - name: Build WASM (nix)
        run: nix build .#neoland-web --option sandbox false --show-trace
