name: Nix Evaluation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: ./.github/actions/cachix-setup
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Flake check
        run: nix flake check --show-trace

  build-web:
    name: Nix build neoland-web
    runs-on: ubuntu-latest
    needs: [flake-check]
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      - uses: ./.github/actions/cachix-setup
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Build WASM (nix)
        run: nix build .#neoland-web --option sandbox false --show-trace

  build-full:
    name: Nix build neoland-full
    runs-on: ubuntu-latest
    needs: [flake-check]
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      - uses: ./.github/actions/cachix-setup
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Build full stack (nix)
        run: nix build .#neoland-full --option sandbox false --show-trace

      - name: Wrapper smoke
        run: ./result/bin/neoland-full --help
