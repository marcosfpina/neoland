name: Web Console

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests (web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - name: Cargo test (web)
        run: cargo test -p neoland-web --verbose

  check:
    name: Check (Leptos WASM)
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - name: Cargo check (web crate)
        run: cargo check -p neoland-web --target wasm32-unknown-unknown

  clippy:
    name: Clippy (Leptos WASM)
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - name: Clippy
        run: cargo clippy -p neoland-web --target wasm32-unknown-unknown -- -D warnings

  wasm-test:
    name: WASM Integration Tests
    runs-on: ubuntu-latest
    needs: [check, clippy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run WASM tests
        run: wasm-pack test --headless --chrome web/

  build:
    name: Build WASM Bundle
    runs-on: ubuntu-latest
    needs: [check, clippy, wasm-test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build
        run: cd web && trunk build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoland-web-dist
          path: web/dist/
          retention-days: 7

      - name: Build summary
        run: |
          echo "## 🌙 Neoland Web Console" >> $GITHUB_STEP_SUMMARY
          echo "✅ WASM bundle built successfully" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lhR web/dist/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
