name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test · wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (WASM web crate)
        run: cargo clippy -p neoland-web --target wasm32-unknown-unknown -- -D warnings

      - name: Unit tests (core)
        run: cargo test --lib --verbose

      - name: Unit tests (web)
        run: cargo test -p neoland-web --verbose

      - name: Check WASM target
        run: cargo check -p neoland-web --target wasm32-unknown-unknown

  python:
    name: Python contracts (no LLM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install deps
        run: cd agents && poetry install --no-interaction

      - name: Contract tests
        run: cd agents && poetry run pytest tests/ -m contract -v

  adr:
    name: ADR validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate ADRs
        run: bash scripts/validate-adr.sh

  sops-verify:
    name: SOPS secrets integrity
    uses: ./.github/workflows/reusable-sops-verify.yml
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
