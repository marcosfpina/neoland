name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test · wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (WASM web crate)
        run: cargo clippy -p neoland-web --target wasm32-unknown-unknown -- -D warnings

      - name: Unit tests (core)
        run: cargo test --lib --verbose

      - name: Unit tests (web)
        run: cargo test -p neoland-web --verbose

      - name: Integration tests (in-process server, ephemeral ports)
        run: cargo test --test rest_api_test --test grpc_integration_test --test agent_contract_test

      - name: Check WASM target
        run: cargo check -p neoland-web --target wasm32-unknown-unknown

  e2e-db:
    name: E2E (Postgres + pgvector + migrations)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: neoland_test
          POSTGRES_USER: neoland
          POSTGRES_PASSWORD: neoland_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neoland -d neoland_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neoland:neoland_test@localhost:5432/neoland_test
      # Missing services must turn this job red, never silently skip
      NEOLAND_TEST_REQUIRE_DEPS: "1"
      NEOLAND_SKIP_EMBEDDINGS: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Apply migrations (embedded)
        run: cargo run -q -- migrate

      - name: Session persistence e2e
        run: cargo test --test agent_session_test

  tls-smoke:
    name: TLS/mTLS smoke (REST + gRPC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Build server
        run: cargo build --bin neoland

      - name: TLS/mTLS smoke
        run: bash scripts/tls-smoke.sh

  python:
    name: Python contracts (no LLM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install deps
        run: cd agents && poetry install --no-interaction

      - name: Contract tests
        run: cd agents && poetry run pytest tests/ -m contract -v

  adr:
    name: ADR validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate ADRs
        run: bash scripts/validate-adr.sh

  sops-verify:
    name: SOPS secrets integrity
    uses: ./.github/workflows/reusable-sops-verify.yml
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
