name: SOPS Verify (Reusable)

on:
  workflow_call:
    secrets:
      SOPS_AGE_KEY:
        required: false

jobs:
  verify:
    name: SOPS integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify SOPS secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [[ -z "$SOPS_AGE_KEY" ]]; then
            echo "SOPS_AGE_KEY not set — skipping (fork PR or missing secret)" >&2
            exit 0
          fi
          mkdir -p ~/.config/sops/age
          printf '%s' "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
          nix run nixpkgs#sops -- --decrypt secrets/neoland.sops.env > /dev/null
          nix run nixpkgs#sops -- --decrypt secrets/cachix.sops.yaml > /dev/null
          echo "All SOPS secrets verified"

      - name: Revoke age key
        if: always()
        run: rm -f ~/.config/sops/age/keys.txt
