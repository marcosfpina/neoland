name: Validate All

# Pipeline final de validação — exercita o gate completo do release:
# qualidade Rust, smoke TLS/mTLS, contratos Python e todos os outputs Nix.
# Nenhuma tarefa de release é considerada concluída sem este workflow verde.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust fmt · clippy · tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (workspace)
        run: cargo test --workspace --lib --verbose

  tls-smoke:
    name: TLS/mTLS smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Build server
        run: cargo build --bin neoland

      - name: TLS/mTLS smoke
        run: bash scripts/tls-smoke.sh

  python-contracts:
    name: Python contracts (no LLM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install deps
        run: cd agents && poetry install --no-interaction

      - name: Contract tests
        run: cd agents && poetry run pytest tests/ -m contract -v

  infra-render:
    name: Docker Compose · Helm render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          NEOLAND_ADMIN_API_KEY: ci-admin-api-key
          NEOLAND_USER_API_KEY: ci-user-api-key
          NEOLAND_READONLY_API_KEY: ci-readonly-api-key
          LLM_API_KEY: ci-placeholder-not-used
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet

      - name: Lint and render Helm chart
        run: |
          mkdir -p release-evidence
          values=(
            --set config.auth.jwtSecret=ci-jwt-secret
            --set config.auth.adminApiKey=ci-admin-api-key
            --set config.auth.userApiKey=ci-user-api-key
            --set config.auth.readonlyApiKey=ci-readonly-api-key
            --set postgresql.auth.password=ci-postgres-password
          )
          helm lint deploy/helm/neoland "${values[@]}"
          helm template neoland deploy/helm/neoland "${values[@]}" \
            > release-evidence/helm-render.yaml
          grep -q 'path: /live' release-evidence/helm-render.yaml
          grep -q 'path: /ready' release-evidence/helm-render.yaml
          grep -q '^  NEOLAND_JWT_SECRET:' release-evidence/helm-render.yaml
          grep -q '^  DATABASE_URL:' release-evidence/helm-render.yaml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: infra-render-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error

  nix-outputs:
    name: Nix build (neoland · web · full)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      - uses: ./.github/actions/cachix-setup
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Flake check
        run: nix flake check --show-trace

      - name: Build neoland
        run: nix build .#neoland --option sandbox false --show-trace

      - name: Build neoland-web
        run: nix build .#neoland-web --option sandbox false --show-trace

      - name: Build neoland-full
        run: nix build .#neoland-full --option sandbox false --show-trace

      - name: Wrapper smoke
        run: ./result/bin/neoland-full --help

  gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: always()
    needs: [rust-quality, tls-smoke, python-contracts, infra-render, nix-outputs]
    steps:
      - name: Write release evidence
        env:
          RUST_RESULT: ${{ needs.rust-quality.result }}
          TLS_RESULT: ${{ needs.tls-smoke.result }}
          PYTHON_RESULT: ${{ needs.python-contracts.result }}
          INFRA_RESULT: ${{ needs.infra-render.result }}
          NIX_RESULT: ${{ needs.nix-outputs.result }}
        run: |
          mkdir -p release-evidence
          {
            echo '# Neoland release evidence'
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Rust fmt, clippy, tests | ${RUST_RESULT} |"
            echo "| TLS/mTLS smoke | ${TLS_RESULT} |"
            echo "| Python contracts | ${PYTHON_RESULT} |"
            echo "| Docker Compose + Helm | ${INFRA_RESULT} |"
            echo "| Nix outputs + wrapper | ${NIX_RESULT} |"
          } | tee release-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: release-evidence/summary.md
          if-no-files-found: error

      - name: Enforce release gate
        env:
          RESULTS: >-
            ${{ needs.rust-quality.result }}
            ${{ needs.tls-smoke.result }}
            ${{ needs.python-contracts.result }}
            ${{ needs.infra-render.result }}
            ${{ needs.nix-outputs.result }}
        run: |
          if [ "$RESULTS" != "success success success success success" ]; then
            echo "Release gate failed: $RESULTS" >&2
            exit 1
          fi
          echo "validate-all: all technical release gates are green"
