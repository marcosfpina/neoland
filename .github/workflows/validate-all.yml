name: Validate All

# Pipeline final de validação — exercita o gate completo do release:
# qualidade Rust, smoke TLS/mTLS, contratos Python e todos os outputs Nix.
# Nenhuma tarefa de release é considerada concluída sem este workflow verde.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust fmt · clippy · tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (workspace)
        run: cargo test --workspace --lib --verbose

  tls-smoke:
    name: TLS/mTLS smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Build server
        run: cargo build --bin neoland

      - name: TLS/mTLS smoke
        run: bash scripts/tls-smoke.sh

  python-contracts:
    name: Python contracts (no LLM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install deps
        run: cd agents && poetry install --no-interaction

      - name: Contract tests
        run: cd agents && poetry run pytest tests/ -m contract -v

  nix-outputs:
    name: Nix build (neoland · web · full)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VOIDNXSEC_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      - name: Flake check
        run: nix flake check --show-trace

      - name: Build neoland
        run: nix build .#neoland --option sandbox false --show-trace

      - name: Build neoland-web
        run: nix build .#neoland-web --option sandbox false --show-trace

      - name: Build neoland-full
        run: nix build .#neoland-full --option sandbox false --show-trace

      - name: Wrapper smoke
        run: ./result/bin/neoland-full --help

  gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [rust-quality, tls-smoke, python-contracts, nix-outputs]
    steps:
      - name: All validations green
        run: echo "✅ validate-all — gate completo verde"
