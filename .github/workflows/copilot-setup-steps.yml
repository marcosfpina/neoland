name: Copilot Development Setup

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust-checks:
    name: Rust Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run Rust checks
        run: nix develop --command cargo check --lib

      - name: Run clippy lints
        run: nix develop --command cargo clippy --lib -- -D warnings

      - name: Format check
        run: nix develop --command cargo fmt -- --check

  rust-tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run unit tests
        run: nix develop --command cargo test --lib

      - name: Run agent tests
        run: nix develop --command cargo test agent_ -- --test-threads=1

  python-tests:
    name: Python Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd agents
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"

      - name: Run contract tests
        run: |
          cd agents
          source .venv/bin/activate
          pytest tests/ -m contract -v

  adr-validation:
    name: ADR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Validate ADRs
        run: nix develop --command bash -c "./scripts/validate-adr.sh"

  security-checks:
    name: Security Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  nix-check:
    name: Nix Flake Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Flake check
        run: nix flake check

      - name: Evaluate dev environment
        run: nix develop --command echo "✅ Development environment is valid"

  production-readiness:
    name: Production Readiness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Validate production readiness
        run: nix develop --command bash -c "./scripts/validate-production-readiness.sh"

  copilot-readiness:
    name: Copilot Context Readiness
    runs-on: ubuntu-latest
    needs:
      - rust-checks
      - rust-tests
      - python-tests
      - adr-validation
      - security-checks
      - nix-check
    steps:
      - uses: actions/checkout@v4

      - name: Verify Copilot context files
        run: |
          echo "✅ Checking Copilot context structure..."
          [ -f ".github/copilot-instructions.md" ] && echo "  ✓ copilot-instructions.md found" || echo "  ✗ copilot-instructions.md missing"
          [ -f "README.md" ] && echo "  ✓ README.md found" || echo "  ✗ README.md missing"
          [ -f "agents/README.md" ] && echo "  ✓ agents/README.md found" || echo "  ✗ agents/README.md missing"
          [ -f "deploy/README.md" ] && echo "  ✓ deploy/README.md found" || echo "  ✗ deploy/README.md missing"

      - name: Summary
        run: |
          echo "## ✅ Copilot Development Environment Ready"
          echo ""
          echo "All checks passed. The environment is ready for:"
          echo "- Rust development (cargo, clippy, fmt)"
          echo "- Python DSPy pipeline development"
          echo "- Architecture Decision Records (ADRs)"
          echo "- Security and compliance validation"
          echo "- Production deployment"
