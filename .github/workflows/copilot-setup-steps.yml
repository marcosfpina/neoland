name: Copilot Development Setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust (fmt · clippy · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --lib -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Agent tests
        run: cargo test agent_ -- --test-threads=1

  python-tests:
    name: Python contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: cd agents && poetry install --no-interaction

      - name: Run contract tests
        run: cd agents && poetry run pytest tests/ -m contract -v

  adr-validation:
    name: ADR validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate ADRs
        run: bash scripts/validate-adr.sh

  security-checks:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  nix-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check
        run: nix flake check --no-build

  copilot-readiness:
    name: Copilot context readiness
    runs-on: ubuntu-latest
    needs: [rust-checks, python-tests, adr-validation, nix-check]
    steps:
      - uses: actions/checkout@v7

      - name: Verify context files
        run: |
          [ -f ".github/CLAUDE.md" ]  && echo "✓ CLAUDE.md"  || echo "✗ CLAUDE.md missing"
          [ -f "README.md" ]          && echo "✓ README.md"  || echo "✗ README.md missing"
          [ -f "ROADMAP.md" ]         && echo "✓ ROADMAP.md" || echo "✗ ROADMAP.md missing"
          [ -f "agents/README.md" ]   && echo "✓ agents/README.md" || echo "  agents/README.md absent (optional)"
