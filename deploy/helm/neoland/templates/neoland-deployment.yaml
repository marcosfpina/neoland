apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neoland.fullname" . }}
  labels:
    {{- include "neoland.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "neoland.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neoland.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "neoland.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      volumes:
        # Shared tmpfs for mmap IPC (SharedFlags 64 bytes) between control-plane and pipeline
        - name: shm-ipc
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: adr-checkpoints
          emptyDir: {}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          command: ["sqlx", "migrate", "run", "--source", "/app/migrations"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "neoland.secretName" . }}
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
        # ── Control Plane ──────────────────────────────────────────────────────
        - name: control-plane
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          command: ["/usr/local/bin/neoland", "server"]
          ports:
            - name: rest
              containerPort: 3001
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "neoland.secretName" . }}
                  key: DATABASE_URL
            - name: NEOLAND_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "neoland.secretName" . }}
                  key: NEOLAND_ADMIN_API_KEY
            - name: NEOLAND_USER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "neoland.secretName" . }}
                  key: NEOLAND_USER_API_KEY
            - name: NEOLAND_READONLY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "neoland.secretName" . }}
                  key: NEOLAND_READONLY_API_KEY
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "neoland.secretName" . }}
                  key: LLM_API_KEY
            - name: NEOLAND_LLM_PROVIDER
              value: {{ .Values.env.llmProvider | quote }}
            - name: NEOLAND_LLM_MODEL
              value: {{ .Values.env.llmModel | quote }}
            - name: NEOLAND_NATS_URL
              value: "nats://{{ include "neoland.fullname" . }}-nats:{{ .Values.nats.clientPort }}"
            - name: NEOLAND_AGENTS_DSPY_URL
              value: "http://localhost:{{ .Values.env.pipelinePort }}"
            - name: NEOLAND_SHM_PATH
              value: /run/neoland/agent-flags.shm
            - name: NEOLAND_CHECKPOINT_DIR
              value: {{ .Values.env.checkpointDir | quote }}
            - name: RUST_LOG
              value: {{ .Values.env.rustLog | quote }}
          volumeMounts:
            - name: shm-ipc
              mountPath: /run/neoland
            - name: adr-checkpoints
              mountPath: /var/lib/neoland
          livenessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.controlPlane | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

        # ── DSPy Pipeline (sidecar) ────────────────────────────────────────────
        - name: dspy-pipeline
          image: "{{ .Values.image.pipeline.repository }}:{{ .Values.image.pipeline.tag }}"
          imagePullPolicy: {{ .Values.image.pipeline.pullPolicy }}
          ports:
            - name: pipeline
              containerPort: 8001
              protocol: TCP
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "neoland.secretName" . }}
                  key: LLM_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "neoland.secretName" . }}
                  key: DATABASE_URL
            - name: NEOLAND_LLM_PROVIDER
              value: {{ .Values.env.llmProvider | quote }}
            - name: NEOLAND_LLM_MODEL
              value: {{ .Values.env.llmModel | quote }}
            - name: NEOLAND_SHM_PATH
              value: /run/neoland/agent-flags.shm
          volumeMounts:
            - name: shm-ipc
              mountPath: /run/neoland
          livenessProbe:
            httpGet:
              path: /health
              port: pipeline
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: pipeline
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.pipeline | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
