{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neoland.fullname" . }}-secrets
  labels:
    {{- include "neoland.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | required "secrets.postgresPassword is required" | quote }}
  NEOLAND_ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | required "secrets.adminApiKey is required" | quote }}
  NEOLAND_USER_API_KEY: {{ .Values.secrets.userApiKey | required "secrets.userApiKey is required" | quote }}
  NEOLAND_READONLY_API_KEY: {{ .Values.secrets.readonlyApiKey | required "secrets.readonlyApiKey is required" | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.secrets.postgresPassword (include "neoland.fullname" .) .Values.postgres.database | quote }}
{{- end }}
