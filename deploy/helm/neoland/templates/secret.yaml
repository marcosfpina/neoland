apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neoland.fullname" . }}-secrets
  labels:
    {{- include "neoland.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Key names here become env var names via the `envFrom.secretRef` in
  # deployment-server.yaml — they must match exactly what the binary reads
  # (src/config.rs / src/auth/mod.rs), not kebab-case Secret conventions.
  NEOLAND_JWT_SECRET: {{ include "neoland.jwtSecret" . | quote }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ include "neoland.databaseUrl" . | quote }}
  {{- end }}
  NEOLAND_ADMIN_API_KEY: {{ required "config.auth.adminApiKey must be set for production — see values.yaml" .Values.config.auth.adminApiKey | quote }}
  NEOLAND_USER_API_KEY: {{ required "config.auth.userApiKey must be set for production — see values.yaml" .Values.config.auth.userApiKey | quote }}
  NEOLAND_READONLY_API_KEY: {{ required "config.auth.readonlyApiKey must be set for production — see values.yaml" .Values.config.auth.readonlyApiKey | quote }}
  {{- if .Values.config.auth.googleClientId }}
  NEOLAND_GOOGLE_CLIENT_ID: {{ .Values.config.auth.googleClientId | quote }}
  {{- end }}
  {{- if .Values.config.auth.googleClientSecret }}
  NEOLAND_GOOGLE_CLIENT_SECRET: {{ .Values.config.auth.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.config.auth.githubClientId }}
  NEOLAND_GITHUB_CLIENT_ID: {{ .Values.config.auth.githubClientId | quote }}
  {{- end }}
  {{- if .Values.config.auth.githubClientSecret }}
  NEOLAND_GITHUB_CLIENT_SECRET: {{ .Values.config.auth.githubClientSecret | quote }}
  {{- end }}
