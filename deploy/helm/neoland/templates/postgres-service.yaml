{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neoland.fullname" . }}-postgres
  labels:
    {{- include "neoland.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None  # headless — StatefulSet DNS: <release>-neoland-postgres:5432
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "neoland.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
