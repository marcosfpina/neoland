# cargo-deny configuration for NEOLAND
# Ref: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Security vulnerability database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = [
    # Example: "RUSTSEC-2020-0001", # Reason for ignoring
]

[licenses]
# License compliance
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]
copyleft = "deny"
allow-osi-fsf-free = "both"
default = "deny"
confidence-threshold = 0.8

# Exceptions for specific crates (if needed)
[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Multiple versions of the same crate
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Deny specific crates (known security issues)
deny = [
    # Example: { name = "openssl", version = "< 0.10.55" }
]

# Skip dependencies during traversal
skip = [
    # Example: { name = "some-crate", version = "=0.1.0" }
]

skip-tree = [
    # Example: { name = "some-crate", version = "=0.1.0", depth = 3 }
]

[sources]
# Source code provenance
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Allow specific git sources (for dependencies not on crates.io)
# [[sources.allow-git]]
# name = "securellm-core"
# repo = "https://github.com/org/securellm-bridge"
