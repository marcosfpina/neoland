[project]
name = "neoland-agents"
version = "0.1.0"
description = "DSPy multi-agent pipeline for Neoland"
authors = [{ name = "voidnxlabs", email = "dev@voidnxlabs.io" }]
requires-python = ">=3.13"

[tool.poetry]
packages = [{ include = "neoland_agents" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
dspy = ">=2.5"
fastapi = ">=0.115"
uvicorn = { version = ">=0.32", extras = ["standard"] }
pydantic = ">=2.9"
asyncpg = ">=0.30"
httpx = ">=0.27"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
anyio = { version = ">=4.0", extras = ["trio"] }
ruff = "*"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires LLM and DB (deselect with -m 'not integration')",
    "contract: schema validation only",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
