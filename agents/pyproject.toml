[project]
name = "neoland-agents"
version = "0.1.0"
description = "DSPy multi-agent pipeline for Neoland"
requires-python = ">=3.13"

dependencies = [
    "dspy>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "asyncpg>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio[trio]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires LLM and DB (deselect with -m 'not integration')",
    "contract: schema validation only",
]

[tool.ruff]
line-length = 100
target-version = "py313"
